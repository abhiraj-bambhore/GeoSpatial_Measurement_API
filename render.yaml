# Render Blueprint — https://render.com/docs/blueprint-spec
# Image is built by GitHub Actions (cd.yaml) and pushed to GHCR.
# Render pulls the pre-built image on every deploy hook trigger.
services:
  - type: web
    name: geospatial-measurement-api
    runtime: image
    image:
      url: ghcr.io/abhiraj-bambhore/geospatial_measurement_api:latest
    plan: free
    region: oregon

    # Render health check — must return 200
    healthCheckPath: /health

    envVars:
      - key: SUPABASE_URL
        sync: false          # Set manually in Render Dashboard → Environment
      - key: SUPABASE_KEY
        sync: false          # Set manually in Render Dashboard → Environment
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: PORT
        value: 8000
