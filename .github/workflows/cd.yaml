# ─────────────────────────────────────────────────────────────────
# CD — Continuous Deployment
# Runs only when CI passes on `main`.
# Flow: Build → Push to GHCR → Deploy to Render
# ─────────────────────────────────────────────────────────────────
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: cd-production
  cancel-in-progress: false   # Never cancel a running production deploy

jobs:
  # ── Gate: Only proceed if CI passed ─────────────────────────
  check-ci:
    name: Verify CI Success
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: CI passed — proceeding to deploy
        run: echo "CI pipeline passed. Starting production deployment."

  # ── 1. Build & Push Docker Image to GHCR ────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: check-ci

    permissions:
      contents: read
      packages: write   # Required to push to ghcr.io

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false   # Reduces manifest size for Render compatibility

      - name: Output image digest
        run: |
          echo "Image pushed: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"

  # ── 2. Deploy to Render ──────────────────────────────────────
  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
      url: ${{ vars.RENDER_APP_URL }}

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Render deploy triggered successfully (HTTP $HTTP_STATUS)"
          else
            echo "Failed to trigger Render deploy (HTTP $HTTP_STATUS)"
            exit 1
          fi

      - name: Wait for Render to come live
        run: |
          echo "Waiting 60s for Render to start the new deployment..."
          sleep 60

      - name: Health check — verify deployment is live
        run: |
          MAX_RETRIES=10
          WAIT=15
          URL="${{ vars.RENDER_APP_URL }}/health"

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Health check attempt $i/$MAX_RETRIES → $URL"
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || echo "000")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Deployment healthy! Service is live."
              exit 0
            fi

            echo "Status: $HTTP_STATUS — retrying in ${WAIT}s..."
            sleep $WAIT
          done

          echo "Health check failed after $MAX_RETRIES attempts."
          exit 1

  # ── 3. Notify on Failure ─────────────────────────────────────
  notify-failure:
    name: Notify on Deploy Failure
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-render]
    if: failure()
    steps:
      - name: Log failure summary
        run: |
          echo "DEPLOYMENT FAILED"
          echo "Branch:   main"
          echo "Commit:   ${{ github.sha }}"
          echo "Actor:    ${{ github.actor }}"
          echo "Run URL:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
